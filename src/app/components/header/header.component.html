<header class="header">
  <div class="container">
    <nav class="nav">
      <a href="#home" class="logo"><span>AS</span> SHANTO</a>
      
      <div class="nav-menu" [class.active]="isMenuOpen">
        <a *ngFor="let item of menuItems" 
           [href]="item.link" 
           class="nav-link"
           (click)="scrollToSection($event, item.link)">
          {{ item.label }}
        </a>
      </div>

      <button class="hire-btn" (click)="scrollToSection($event, '#contact')">Contact Me</button>

      <button class="mobile-toggle" (click)="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </nav>
  </div>
</header>
