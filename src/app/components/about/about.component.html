<section id="about" class="section about">
  <div class="container">
    <h2 class="section-title" appFloatIn>About Me</h2>
    <div class="about-content">
      <p *ngFor="let paragraph of bioParagraphs; let index = index"
         class="about-paragraph"
         appFloatIn
         [floatInDelay]="index * 90">{{ paragraph }}</p>
    </div>
  </div>
</section>
