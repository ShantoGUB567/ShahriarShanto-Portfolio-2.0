<section id="home" class="hero">
  <div class="binary-rain" aria-hidden="true">
    <span *ngFor="let drop of binaryDrops" class="binary-drop"
      [style.left.%]="drop.left"
      [style.--fall-delay.s]="drop.delay"
      [style.--fall-duration.s]="drop.duration"
      [style.--drift.px]="drop.drift"
      [style.--drop-opacity]="drop.opacity">{{ drop.value }}</span>
  </div>
  <div class="container">
    <div class="hero-content">
      <div class="hero-left" appFloatIn floatInDirection="left">
        <div class="profile-card">
          <img [src]="data.profileImage" [alt]="data.name" class="profile-image">
          <div class="profile-info" appFloatIn floatInDirection="right" [floatInDelay]="180">
            <span class="availability">
              <span class="status-dot"></span>
              Available for work
            </span>
          </div>
        </div>
      </div>

      <div class="hero-right">
        <div class="eyebrow" appFloatIn>MOBILE ENGINEER · DHAKA, BD</div>
        <h1 class="hero-title">
          <span class="greeting" appFloatIn>Al Shahriar</span>
          <span class="name highlight" appFloatIn [floatInDelay]="70">Ahommed</span>
          <span class="name" appFloatIn [floatInDelay]="140">Shanto.</span>
        </h1>
        
        <p class="hero-subtitle" appFloatIn>{{ data.title }}</p>
        <p class="hero-description" appFloatIn>{{ data.subtitle }}</p>

        <div class="hero-actions" appFloatIn>
          <a href="#projects" class="primary-action">Explore my work <span>↗</span></a>
          <a [href]="data.resumeUrl" target="_blank" class="secondary-action">Download resume</a>
        </div>

        <div class="social-links" appFloatIn>
          <a *ngFor="let social of socials" 
             [href]="social.url" 
             target="_blank"
             class="social-icon"
             [title]="social.label">
            <img [src]="social.icon" [alt]="social.label" class="social-img">
          </a>
        </div>

        <div class="contact-info" appFloatIn>
          <div class="contact-item">
            <span class="icon">📧</span>
            <span>{{ contact.email }}</span>
          </div>
          <div class="contact-item">
            <span class="icon">📱</span>
            <span>{{ contact.phone }}</span>
          </div>
          <div class="contact-item">
            <span class="icon">📍</span>
            <span>{{ contact.location }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
