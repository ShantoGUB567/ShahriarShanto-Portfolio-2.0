<section id="skills" class="section tech-stack">
  <div class="container">
    <h2 class="section-title">Technical Skills</h2>
    <p class="section-subtitle">My professional stack and engineering technologies</p>
    
    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button 
        *ngFor="let cat of categories" 
        [class.active]="activeFilter === cat.id"
        (click)="setFilter(cat.id)"
        class="filter-btn"
      >
        {{ cat.label }}
      </button>
    </div>

    <!-- Skills Grid -->
    <div class="skills-grid">
      <div 
        *ngFor="let skill of getFilteredSkills()" 
        class="skill-card fade-in-up" 
        [class]="skill.iconType"
      >
        <div class="skill-glow"></div>
        <div class="skill-icon-container">
          <!-- Render custom SVGs for Google Play and App Store -->
          <ng-container *ngIf="skill.iconType === 'googleplay' || skill.iconType === 'appstore'; else deviconTemplate">
            <div [ngSwitch]="skill.iconType" class="custom-svg-wrapper">
              <!-- Google Play -->
              <svg *ngSwitchCase="'googleplay'" viewBox="0 0 24 24" class="svg-icon">
                <path fill="#00C3FF" d="M3.25 1.413c-.39.4-.62.98-.62 1.639v17.896c0 .659.23 1.239.62 1.639l.06.06 10.473-10.473L3.31 1.473l-.06-.06z"/>
                <path fill="#FFC107" d="M17.234 15.422l-3.45-3.45 3.45-3.45 4.062 2.316c.866.495.866 1.782 0 2.277l-4.062 2.307z"/>
                <path fill="#3FF374" d="M13.784 11.972L3.31 22.446c.394.394.973.57 1.58.232l12.344-7.05-3.45-3.656z"/>
                <path fill="#FF3A44" d="M3.31 1.472c.607-.338 1.186-.162 1.58.232L17.234 8.5l-3.45 3.472-10.474-10.5z"/>
              </svg>
              <!-- App Store (Apple Icon) -->
              <svg *ngSwitchCase="'appstore'" viewBox="0 0 24 24" class="svg-icon">
                <path fill="#007AFF" d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-.96.04-2.13.64-2.82 1.45-.6.69-1.12 1.83-1 2.94.96.08 2.06-.51 2.83-1.33z"/>
              </svg>
            </div>
          </ng-container>
          <!-- Devicon Template -->
          <ng-template #deviconTemplate>
            <i [class]="getDeviconClass(skill.iconType) + ' devicon-logo'"></i>
          </ng-template>
        </div>
        
        <h3 class="skill-name">{{ skill.name }}</h3>
      </div>
    </div>
  </div>
</section>
